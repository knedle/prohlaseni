<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programové prohlášení vlády — sledování plnění</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Programové prohlášení vlády České republiky</h1>
  <p class="subtitle">Sledování plnění bodů programového prohlášení vlády (leden 2026)</p>
  <p class="source-links">
    Zdrojové dokumenty:
    <a href="navrh-listopad-2025.pdf" target="_blank" rel="noopener">Návrh (listopad 2025)</a>
    ·
    <a href="final-leden-2026.pdf" target="_blank" rel="noopener">Finální verze (leden 2026)</a>
  </p>
  <div class="counter">
    <span id="counter-text">0 / 0 splněno</span>
    <span id="counter-pct">0 %</span>
    <span class="counter-breakdown">
      (<span id="counter-cekajici">0</span> čekající ·
      <span id="counter-nesplneno">0</span> nesplněno ·
      <span id="counter-splneno">0</span> splněno)
    </span>
  </div>
</header>

<section class="filters">
  <h2>Filtry</h2>
  <div class="filter-row">
    <div class="filter-group">
      <label for="filter-category">Kategorie</label>
      <select id="filter-category">
        <option value="all">Všechny kategorie</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-priority">Priorita</label>
      <select id="filter-priority">
        <option value="all">Všechny priority</option>
        <option value="vysoká">Vysoká důležitost</option>
        <option value="nízká">Nízká důležitost</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-status">Stav splnění</label>
      <select id="filter-status">
        <option value="all">Vše</option>
        <option value="čekající">Čekající</option>
        <option value="nesplněno">Nesplněno</option>
        <option value="splněno">Splněno</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-statusquo">Typ</label>
      <select id="filter-statusquo">
        <option value="all">Vše</option>
        <option value="true">Status quo</option>
      </select>
    </div>
  </div>
</section>

<main id="pledge-list"></main>

<script src="app.js"></script>
</body>
</html>
